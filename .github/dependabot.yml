version: 2
updates:
  # Composer dependencies (PHP packages in composer.json)
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Bundle minor + patch bumps together so dev / minor noise lands in one PR
      # per ecosystem rather than one per package.
      php-dev:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions versions in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Daily: a new API contract version (poli-page/api-contract) arrives as a PR at once.
      interval: daily
      time: "08:00"
      timezone: Europe/Paris
    # Hold other action bumps 3 days after their release; a new contract
    # version arrives at once.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      # The API contract gets PRs of its own: a contract bump shows what the
      # API change breaks, never mixed with other action bumps.
      api-contract:
        patterns:
          - "poli-page/api-contract"
      actions-dev:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "poli-page/api-contract"
        update-types:
          - minor
          - patch
