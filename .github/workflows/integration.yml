name: Integration

on:
  # Nightly sweep against the API to catch upstream drift before users
  # do — the SDK retry / classifier code is wire-shape sensitive.
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  # Re-run on every push to main so a freshly-merged change can't break
  # the integration contract silently.
  push:
    branches: [main]
  # And let maintainers kick it off manually for ad-hoc validation.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'poli-page/sdk-php' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']  # one near-floor + one near-ceiling
    env:
      # A pp_sandbox_ key of an organization whose getting-started project
      # is untouched: the suite renders getting-started/welcome.
      POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
      # Optional. Kept in a secret so no API host is named here; when it is
      # unset the SDK default applies.
      POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Skip when no API key is available
        if: env.POLI_PAGE_API_KEY == ''
        run: |
          echo "POLI_PAGE_API_KEY secret is not set on this runner — skipping integration suite."
          echo "Configure repository secrets > POLI_PAGE_API_KEY (a pp_sandbox_ key) to enable nightly runs."
          exit 0

      - name: Install dependencies
        if: env.POLI_PAGE_API_KEY != ''
        run: |
          composer update --prefer-stable --no-progress --no-interaction --no-scripts

      - name: Run integration suite
        if: env.POLI_PAGE_API_KEY != ''
        run: |
          vendor/bin/phpunit --testsuite=integration
